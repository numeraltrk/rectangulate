<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rectangulate</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="logo">
                <h1>Rectangulate</h1>
            </div>

            <div class="control-panel glass-panel">
                <div class="input-group">
                    <label for="equation-a">Quadratic Equation</label>
                    <div id="equation-display" class="equation-preview"
                        style="font-family: 'Outfit', sans-serif; font-size: 1.2rem; color: var(--text-color); margin-bottom: 10px; min-height: 24px;">
                        $ax^2 + bx + c$</div>
                    <div class="equation-inputs">
                        <div class="input-wrapper">
                            <input type="number" id="coeff-a" value="1" min="1" max="5">
                            <span>$a$</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="coeff-b" value="5" min="-10" max="10">
                            <span>$b$</span>
                        </div>
                        <div class="input-wrapper">
                            <input type="number" id="coeff-c" value="6" min="-10" max="10">
                            <span>$c$</span>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button id="btn-solve" class="btn primary">Solve</button>
                    <button id="btn-check" class="btn success">Check</button>
                    <button id="btn-reset" class="btn secondary">Clear</button>
                </div>
            </div>

            <!-- Tile Bank Logic -->
            <div class="legend glass-panel">
                <h3>Tile Bank</h3>

                <!-- x^2 (Positive) -->
                <div class="tile-row">
                    <div class="tile-label">
                        <div class="tile-icon" style="background: var(--tile-x2);"></div>
                        x²
                    </div>
                    <div class="tile-controls">
                        <button class="ctrl-btn remove" data-type="x2" data-neg="false">-</button>
                        <button class="ctrl-btn add" data-type="x2" data-neg="false">+</button>
                    </div>
                </div>

                <!-- x (Positive) -->
                <div class="tile-row">
                    <div class="tile-label">
                        <div class="tile-icon rect" style="background: var(--tile-x);"></div>
                        x
                    </div>
                    <div class="tile-controls">
                        <button class="ctrl-btn remove" data-type="x" data-neg="false">-</button>
                        <button class="ctrl-btn add" data-type="x" data-neg="false">+</button>
                    </div>
                </div>

                <!-- -x (Negative) -->
                <div class="tile-row">
                    <div class="tile-label">
                        <div class="tile-icon rect" style="background: var(--tile-neg);"></div>
                        -x
                    </div>
                    <div class="tile-controls">
                        <button class="ctrl-btn remove" data-type="x" data-neg="true">-</button>
                        <button class="ctrl-btn add" data-type="x" data-neg="true">+</button>
                    </div>
                </div>

                <!-- 1 (Positive) -->
                <div class="tile-row">
                    <div class="tile-label">
                        <div class="tile-icon small" style="background: var(--tile-1);"></div>
                        1
                    </div>
                    <div class="tile-controls">
                        <button class="ctrl-btn remove" data-type="one" data-neg="false">-</button>
                        <button class="ctrl-btn add" data-type="one" data-neg="false">+</button>
                    </div>
                </div>

                <!-- -1 (Negative) -->
                <div class="tile-row">
                    <div class="tile-label">
                        <div class="tile-icon small" style="background: var(--tile-neg);"></div>
                        -1
                    </div>
                    <div class="tile-controls">
                        <button class="ctrl-btn remove" data-type="one" data-neg="true">-</button>
                        <button class="ctrl-btn add" data-type="one" data-neg="true">+</button>
                    </div>
                </div>

                <div class="hint" style="margin-top: 20px; text-align: center;">
                    Double Click to Rotate
                </div>
            </div>

        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
            <canvas id="app-canvas"></canvas>

        </main>

        <div id="feedback" class="feedback-area hidden">
            <button class="close-btn">&times;</button>
            <p class="message">Perfect Rectangle formed!</p>
        </div>
    </div>



    <!-- MathJax for nice rendering of the equation labels if needed, though we primarily use canvas -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script type="module" src="scripts/main.js"></script>
</body>

</html>
